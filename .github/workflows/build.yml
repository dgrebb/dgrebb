name: 🔖 README

on:
  push:
  workflow_dispatch:
  schedule:
    - cron: "0 */3 * * *"

jobs:
  build:
    name: 🚧 Building README
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 12.23.0

      - name: Use Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "26"
          cache: pnpm

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Build README.md
        env:
          WAKAPI_API_KEY: ${{ secrets.WAKAPI_API_KEY }}
          PINBOARD_TOKEN: ${{ secrets.PINBOARD_TOKEN }}
        run: pnpm build && pnpm gen

      - name: Commit and Push if Changed
        run: |-
          git add .
          git diff
          git config --global user.email "bot@ss4sp.com"
          git config --global user.name "dgrebeepboop"
          git commit -m "docs: auto-update README.md" -a || exit 0
          git push
